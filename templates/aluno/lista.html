{% include 'dashboard/cabecalho.html' %}

<div class="container mt-4"> 
    <h1 class="mb-4">Lista de alunos</h1>

    
    <a href="/aluno/cadastrar" class="btn btn-success mb-3">Cadastrar Novo Aluno</a>

    <div class="row">
        <div class="col-12"> 
            <table class="table table-striped table-hover"> 
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Idade</th>
                        <th>Cidade</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    {% for aluno in lista %}
                    <tr>
                        <td>{{ aluno[0] }}</td>
                        <td>{{ aluno[1] }}</td>
                        <td>{{ aluno[2] }}</td>
                        <td>{{ aluno[3] }}</td>
                        <td class="text-center">
                            <a href="/aluno/editar/{{ aluno[0] }}" class="btn btn-sm btn-primary">Editar</a>
                            <a href="/aluno/excluir/{{ aluno[0] }}" class="btn btn-sm btn-danger" onclick="return confirm('Tem certeza que deseja excluir este aluno?');">Excluir</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

{% include 'dashboard/rodape.html' %}
