{% include 'dashboard/cabecalho.html' %}

<h1 class="mb-4">Listagem de Turmas</h1>

<a href="/turma/form" class="btn btn-primary mb-3">Nova</a>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Semestre</th>
            <th>Curso</th>
            <th>Professor</th>
            <th>Disciplina</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody>
        {% for turma in lista_turmas %}
        <tr>
            <td>{{ turma[0] }}</td>
            <td>{{ turma[1] }}</td>
            <td>{{ turma[2] }}</td>
            <td>{{ turma[3] }}</td>
            <td>{{ turma[4] }}</td>
            <td>
                <a href="/turma/editar/{{ turma[0] }}" class="btn btn-primary btn-sm">Editar</a>
                <a href="/turma/remover/{{ turma[0] }}" class="btn btn-danger btn-sm" 
                   onclick="return confirm('Tem certeza que deseja remover esta turma?')">Remover</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% include 'dashboard/rodape.html' %}
