{% include 'dashboard/cabecalho.html' %}
<div class="container mt-4">
    <h1 class="mb-4">Editar Turma</h1>
    <div class="card"><div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome da Turma</label>
                <input type="text" class="form-control" id="nome" name="nome" value="{{ turma[1] }}" required>
            </div>
            <div class="mb-3">
                <label for="id_curso" class="form-label">ID do Curso</label>
                <input type="number" class="form-control" id="id_curso" name="id_curso" value="{{ turma[2] }}" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar Alterações</button>
            <a href="/turma" class="btn btn-secondary">Cancelar</a>
        </form>
    </div></div>
</div>
{% include 'dashboard/rodape.html' %}
